name: Quality gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# One run per PR. A new push supersedes the previous run, which matters when an
# agent is pushing fixes in a tight loop.
concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # corepack activates the pnpm/yarn version pinned by the host's
      # `packageManager` field. It is a no-op on an npm host, so it is
      # unconditional rather than guarded on a lockfile.
      - name: Enable corepack
        run: corepack enable

      # cache: npm with a two-path cache-dependency-path stays valid even on a
      # host with no package-lock.json (e.g. a yarn/pnpm project): the second
      # path, .loopwright/package-lock.json, is always vendored and always
      # present, so setup-node's cache-key hash always has at least one real
      # lockfile to match against. It only fails if NEITHER path resolves.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .loopwright/package-lock.json

      # The collectors run the host's own binaries out of node_modules/.bin, so
      # this step is what makes them resolve at all. Skipping it does not fail
      # here — it fails later, as every collector reporting 'n/a', which reads
      # like a broken gate rather than a missing install. Each branch uses the
      # lockfile-respecting install for its package manager so CI matches the
      # committed tree.
      - name: Install host dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --immutable || yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "no lockfile — skipping host install; install host deps in a preceding step if needed"
          fi

      - name: Install engine dependencies
        run: npm ci
        working-directory: .loopwright

      - name: Engine unit tests
        if: github.repository == 'SamuelDenani/loopwright'
        run: npx vitest run
        working-directory: .loopwright

      # Collectors write reports and exit 0; the gate is the only failing step.
      - name: Collect reports
        run: node .loopwright/scripts/run-report.mjs --all

      - name: Quality gate
        id: gate
        continue-on-error: true
        run: node .loopwright/scripts/quality-gate.mjs

      - name: Installer smoke test
        if: github.repository == 'SamuelDenani/loopwright'
        run: bash .loopwright/tests/installer.test.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: .loopwright/reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Sticky PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .loopwright/scripts/sticky-comment.mjs .loopwright/reports/quality-gate.md

      - name: Enforce verdict
        if: steps.gate.outputs.verdict == 'block' || steps.gate.outcome == 'failure'
        run: |
          echo "Quality gate blocked this PR: ${{ steps.gate.outputs.blocking }} blocker(s)."
          exit 1
