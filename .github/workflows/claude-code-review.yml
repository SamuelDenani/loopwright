name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Draft PRs are still being babysat by the orchestrator against the
    # quality gate; the (expensive) review only runs once the PR is ready.
    if: ${{ !github.event.pull_request.draft }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write so the sticky review comment can be posted
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The review's git-history agent reads blame and prior commits on the
          # touched files; a shallow clone leaves it with nothing to read.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The review skill drives everything through `gh` — it reads the PR
          # with `gh pr view`/`gh pr diff` and posts its verdict with
          # `gh pr comment`. The action disables Bash by default, so without
          # this allowlist every one of those calls is denied and the job goes
          # green having done nothing. The skill's own `allowed-tools` frontmatter
          # does not substitute for this.
          #
          # --allowedTools REPLACES the default tool set rather than extending
          # it, so everything the skill touches has to be named here. Task is
          # load-bearing: the skill fans out to Haiku and Sonnet subagents from
          # step 1 onward, and without it the run dies on the first tool call.
          claude_args: |
            --allowedTools "Task,Skill,TodoWrite,Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh api:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*),Bash(cat:*),Bash(ls:*),Bash(find:*)"
          # If the review ever goes quiet again, the summary log only reports a
          # denial count — set show_full_output: true to see which call is being
          # refused, then turn it back off.
          # The skill posts its own comment and deliberately stays silent when it
          # finds nothing (its steps 1 and 6 both say "do not proceed"). That makes
          # "reviewed clean" indistinguishable from "never ran" — which is exactly
          # the failure this workflow hit. Force the clean-run comment instead.
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            The following override the skill's own instructions where they conflict:

            1. Run every subagent synchronously and read its result in the same
               turn. Never launch a background or async agent, and never end your
               turn to wait for one. This is a non-interactive run: ending the
               turn ends the review, and nothing gets published.
            2. Never exit early. The skill's step 1 eligibility check and its
               step 6 "nothing cleared the confidence bar" branch both stop
               without commenting. Ignore both and carry on to the final comment,
               whatever they conclude.
            3. Finish by running `gh pr comment` exactly once. When no issue
               cleared the bar, post the skill's "No issues found" form.

            The run has failed if it ends without a comment on the pull request.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

